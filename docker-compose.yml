services:
  postgres:
    image: postgres:16-alpine
    container_name: dead-spin-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: deadspin
      POSTGRES_PASSWORD: deadspin
      POSTGRES_DB: deadspin
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deadspin -d deadspin']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dead-spin-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
  redis-data:
