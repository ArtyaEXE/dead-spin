# Локальная инфраструктура.
#   pnpm db:up                       — только Postgres (обычный dev-цикл)
#   docker compose --profile full up — Postgres + API из Dockerfile,
#                                      чтобы проверить прод-образ локально
services:
  postgres:
    image: postgres:16-alpine
    container_name: dead-spin-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: deadspin
      POSTGRES_PASSWORD: deadspin
      POSTGRES_DB: deadspin
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deadspin -d deadspin']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dead-spin-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://deadspin:deadspin@postgres:5432/deadspin
      JWT_SECRET: local-docker-secret-at-least-32-bytes-long-000
      CORS_ORIGINS: '*'
    ports:
      - '3001:3001'

volumes:
  pg-data:
