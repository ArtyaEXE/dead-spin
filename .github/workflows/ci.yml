# CI: проверки на каждом push (кроме main — там его вызывает deploy.yml)
# и на каждом PR. Один job: линт, типы, тесты, уровни, сборки клиента и API.
# Отдельно — сборка Docker-образа API без публикации: ловит поломку Dockerfile.

name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # версия берётся из package.json#packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Levels
        run: pnpm validate:levels

      - name: Build API
        run: pnpm --filter @dead-spin/api build

      - name: Build web
        run: pnpm --filter @dead-spin/game build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/game/dist
          retention-days: 7

  docker:
    name: docker build (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
