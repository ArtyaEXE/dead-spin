# Render Blueprint — автодеплой API и Bot из монорепо.
# Frontend (apps/game) деплоится отдельно на Cloudflare Pages (статика).
#
# Free tier особенности:
#   - preDeployCommand недоступен → миграции прогоняем в startCommand api.
#   - Сервисы засыпают через 15 мин без HTTP → cold start ~30–60 c.

services:
  # ---------- API (HTTP) ----------
  - type: web
    name: dead-spin-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @dead-spin/api run db:migrate && pnpm --filter @dead-spin/api run start:prod
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render инжектит PORT автоматом — читаем его в src/config.ts.
      - key: DATABASE_URL          # из Neon: postgresql://...neon.tech/...
        sync: false
      - key: JWT_SECRET            # 32+ байта
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN    # токен @BotFather
        sync: false
      - key: TEST
        value: "0"
      - key: FAKE_USER_PASSWORD
        value: ""
      - key: MONGO_URL
        value: ""
      - key: CORS_ORIGINS          # e.g. "https://dead-spin.pages.dev"
        sync: false
      - key: CRON_SECRET           # для POST /cron/* (weekly digest и т.п.)
        generateValue: true
      - key: SENTRY_DSN            # опционально: error tracking. Пусто = отключён
        sync: false
      - key: POSTHOG_KEY           # опционально: product analytics (PostHog)
        sync: false
      - key: POSTHOG_HOST          # default https://eu.i.posthog.com
        sync: false
      - key: WEB_APP_URL           # для линков в "полный бак" push'ах (тот же что у бота)
        sync: false

  # ---------- Bot (polling) ----------
  - type: web
    name: dead-spin-bot
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @dead-spin/bot run start:prod
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Делим DATABASE_URL с API — один и тот же Postgres.
      - key: DATABASE_URL
        fromService:
          type: web
          name: dead-spin-api
          envVarKey: DATABASE_URL
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: dead-spin-api
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: WEB_APP_URL           # "https://dead-spin.pages.dev"
        sync: false
      - key: BOT_MODE
        value: polling
      - key: ALLOWLIST_OPEN
        value: "0"
      - key: FEEDBACK_URL          # e.g. "https://t.me/dead_spin_testers" — куда тестеры пишут о багах
        sync: false
