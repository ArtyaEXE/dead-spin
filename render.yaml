# Render Blueprint — API из Docker-образа (apps/api/Dockerfile).
# Frontend (apps/game) деплоится отдельно на Cloudflare (см. .github/workflows/deploy.yml).
#
# autoDeploy выключен намеренно: деплой запускает GitHub Actions через
# Deploy Hook только после зелёного CI на main. Хук: Render → сервис →
# Settings → Deploy Hook → в секрет RENDER_DEPLOY_HOOK_URL репозитория.
#
# Free tier: нет preDeployCommand → миграции накатываются на старте
# контейнера (CMD в Dockerfile); сервис засыпает через 15 мин без HTTP.

services:
  - type: web
    name: dead-spin-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # PORT инжектит Render; Dockerfile слушает $PORT.
      - key: DATABASE_URL          # Neon: postgresql://...neon.tech/...?sslmode=require
        sync: false
      - key: JWT_SECRET            # 32+ байта
        generateValue: true
      - key: CORS_ORIGINS          # https://dead-spin.<account>.workers.dev
        sync: false
      - key: SENTRY_DSN            # опционально; пусто = выключен
        sync: false
      - key: POSTHOG_KEY           # опционально
        sync: false
      - key: POSTHOG_HOST          # default https://eu.i.posthog.com
        sync: false
