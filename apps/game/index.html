<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<meta name="theme-color" content="#19130F" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<title>Dead Spin</title>
</head>
<body>
	<div id="root"></div>
	<!--
		vConsole — мобильный DevTools для WebView. Включается через ?debug=1
		в URL (или через localStorage 'dead-spin.debug' = '1'). Позволяет
		видеть консоль и Network прямо на телефоне без USB-debugging.
	-->
	<script>
		(() => {
			const url = new URL(window.location.href);
			const qsDebug = url.searchParams.get('debug') === '1';
			let lsDebug = false;
			try { lsDebug = localStorage.getItem('dead-spin.debug') === '1'; } catch {}
			if (!qsDebug && !lsDebug) return;
			try { localStorage.setItem('dead-spin.debug', '1'); } catch {}
			const s = document.createElement('script');
			s.src = 'https://unpkg.com/vconsole@3/dist/vconsole.min.js';
			s.onload = () => { new window.VConsole(); };
			document.head.appendChild(s);
		})();
	</script>
	<script type="module" src="/src/main.tsx"></script>
</body>
</html>
